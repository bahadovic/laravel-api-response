name: run-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2, 8.3, 8.4 ]
        laravel: [ 10, 11, 12 ]
        include:
          - laravel: 10
            testbench: 8.*
          - laravel: 11
            testbench: 9.*
          - laravel: 12
            testbench: 10.*
        exclude:
          - php: 8.4
            laravel: 10

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Configure Composer Security Resolver
        run: |
          composer config --json policy.advisories.block false || true

      - name: Install dependencies
        env:
          COMPOSER_NO_BLOCKING: 1
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --no-audit

      - name: Run Static Analysis
        run: composer analyse

      - name: Execute tests
        run: composer test